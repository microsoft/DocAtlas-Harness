[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docatlas"
version = "0.3.0"
description = "DocAtlas — a document-understanding harness with portable Agent Skills."
readme = "README.md"
license = "MIT"
authors = [{ name = "Microsoft Research" }]
keywords = ["agents", "document-understanding", "multimodal", "pdf", "retrieval"]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ── LLM / runtime core ──
    "openai>=1.40",
    "azure-identity>=1.15",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",

    # ── PDF I/O (Read skill, build-md, build-tree shared helpers) ──
    "pypdf>=6.15.0",
    "pymupdf>=1.23",
    "pillow>=12.3.0",
    "pycryptodome>=3.20",   # optional crypto backend for encrypted PDFs

    # ── PDF → markdown / figures (build-md, Docling backend) ──
    # Heron layout + TableFormer + EasyOCR; CPU-only by default,
    # uses GPU automatically if torch sees one. ~2 GB of model weights
    # downloaded from HuggingFace on first run.
    "docling>=2.50,<3",
    "docling-core>=2.0",

    # ── Tree construction (build-tree wraps PageIndex) ──
    # PageIndex is vendored under docatlas/_vendor/pageindex; see its
    # UPSTREAM.md for provenance. No separate PyPI install is needed.
    # We list pageindex's only non-trivial dep (tiktoken) here so it lands
    # in our uv.lock.
    "tiktoken>=0.7",
]

[project.optional-dependencies]
gpu = [                        # explicit Torch floor for GPU deployments
    "torch>=2.13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
docatlas = "docatlas.__main__:main"
harness = "docatlas.__main__:main"

[project.urls]
Homepage = "https://github.com/microsoft/DocAtlas-Harness"
Repository = "https://github.com/microsoft/DocAtlas-Harness"
Issues = "https://github.com/microsoft/DocAtlas-Harness/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["docatlas*"]

[tool.setuptools.package-data]
"docatlas.profiles" = ["*.yaml"]
"docatlas.skills" = ["README.md"]
"docatlas.skills._common" = ["README.md"]
"docatlas.skills.note" = ["SKILL.md", "tool.json"]
"docatlas.skills.read" = ["SKILL.md", "tool.json"]
"docatlas.skills.review" = ["SKILL.md", "tool.json"]
"docatlas.skills.search" = ["SKILL.md", "tool.json"]
"docatlas._vendor.pageindex" = ["config.yaml", "LICENSE", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docatlas/_vendor"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
check_untyped_defs = true
exclude = "^docatlas/_vendor/"
ignore_missing_imports = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "docatlas._vendor.*"
ignore_errors = true

[tool.coverage.run]
omit = ["docatlas/_vendor/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
