<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">DocAtlas terminal interface</title>
  <desc id="desc">A dark terminal showing at-sign document selection, Search and Read tool calls, an evidence-grounded answer, and run statistics.</desc>
  <rect width="1100" height="650" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1098" height="648" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="32" cy="29" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="29" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="29" r="7" fill="#27c93f"/>
  <text x="550" y="35" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">docatlas tui</text>
  <line x1="0" y1="52" x2="1100" y2="52" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="34" y="88" fill="#58a6ff">╭─</text>
    <text x="66" y="88" fill="#f0f6fc" font-weight="700">Open documents</text>
    <text x="34" y="119" fill="#8b949e">│</text>
    <text x="66" y="119" fill="#58a6ff">@report.pdf</text>
    <text x="220" y="119" fill="#58a6ff">@annual_report.pdf</text>
    <text x="34" y="150" fill="#8b949e">│</text>
    <text x="66" y="150" fill="#8b949e">[1] One PDF   [2] Multiple PDFs   [3] Entire folder</text>
    <text x="34" y="181" fill="#58a6ff">╰─</text>
    <text x="66" y="181" fill="#3fb950">Selected · 2 PDFs</text>

    <text x="34" y="229" fill="#58a6ff">╭─</text>
    <text x="66" y="229" fill="#f0f6fc" font-weight="700">Turn 1</text>
    <text x="34" y="260" fill="#8b949e">│</text>
    <text x="66" y="260" fill="#d29922">◌</text>
    <text x="92" y="260" fill="#8b949e">Waiting for model...</text>
    <text x="34" y="291" fill="#58a6ff">├─</text>
    <text x="66" y="291" fill="#f0f6fc" font-weight="700">Search</text>
    <text x="34" y="322" fill="#8b949e">│</text>
    <text x="66" y="322" fill="#8b949e">query</text>
    <text x="138" y="322" fill="#c9d1d9">Find financial highlights and roadmap</text>
    <text x="34" y="353" fill="#8b949e">│</text>
    <text x="66" y="353" fill="#3fb950">✓ Completed</text>
    <text x="194" y="353" fill="#8b949e">· 6.9s</text>
    <text x="34" y="384" fill="#58a6ff">├─</text>
    <text x="66" y="384" fill="#f0f6fc" font-weight="700">Read</text>
    <text x="34" y="415" fill="#8b949e">│</text>
    <text x="66" y="415" fill="#8b949e">pages</text>
    <text x="138" y="415" fill="#c9d1d9">2,3,5</text>
    <text x="34" y="446" fill="#8b949e">│</text>
    <text x="66" y="446" fill="#3fb950">✓ Completed</text>
    <text x="194" y="446" fill="#8b949e">· 0.2s</text>
    <text x="34" y="477" fill="#58a6ff">╰─</text>
    <text x="66" y="477" fill="#8b949e">Turn 1 complete · 12.4s</text>

    <text x="34" y="525" fill="#3fb950">╭─</text>
    <text x="66" y="525" fill="#f0f6fc" font-weight="700">Answer</text>
    <text x="34" y="556" fill="#8b949e">│</text>
    <text x="66" y="556" fill="#c9d1d9">Revenue was USD 54.6M [p. 2]; West grew fastest [p. 3].</text>
    <text x="34" y="587" fill="#3fb950">╰─</text>

    <text x="645" y="587" fill="#3fb950">✓ Run complete</text>
    <text x="824" y="587" fill="#8b949e">4 turns · 3 tools · 28.5s</text>
  </g>
</svg>
