packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false

patchedDependencies:
  '@earendil-works/pi-coding-agent@0.85.1': patches/@earendil-works__pi-coding-agent@0.85.1.patch

# Minimal reviewed security fixes; keep the Pi version/patch and wire schemas.
# Scope overrides to the current dependency majors, never an unrelated upgrade.
overrides:
  'ajv@^8': 8.18.0
  'fast-uri@^3': 3.1.8
  'undici@^8': 8.10.2
  'ip-address@^10': 10.7.1
  'brace-expansion@^5': 5.0.12
  'hono@^4': 4.13.7
  'proxy-addr@^2': 2.0.8
  'source-map-js@^1': 1.2.2
  '@modelcontextprotocol/sdk@^1': 1.31.0

# This optional provider peer existed in the imported native Pi baseline.
# Preserve its capability when resolving the security override, not prune it.
packageExtensions:
  '@earendil-works/pi-ai@0.85.1':
    dependencies:
      '@modelcontextprotocol/sdk': 1.31.0
