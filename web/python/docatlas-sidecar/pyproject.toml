[project]
name = "docatlas-dsh-sidecar"
version = "0.0.0"
description = "Document-processing sidecar for the DocAtlas DSH plugin"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "regex==2026.5.9",
    "rfc3339-validator==0.1.4",
    "sortedcontainers==2.4.0",
]

[project.scripts]
docatlas-sidecar = "docatlas_dsh_sidecar.__main__:main"
docatlas-tree = "docatlas_dsh_sidecar.tree_cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["docatlas_dsh_sidecar"]
data_file = ".cache/coverage/python/.coverage"
omit = ["*/generated_schema_bundle.py", "*/_vendor/*"]

[tool.coverage.report]
fail_under = 78
precision = 2
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/docatlas_dsh_sidecar/generated_schema_bundle.py", "src/docatlas_dsh_sidecar/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/typings"]
python_version = "3.12"
strict = true
exclude = ["_vendor/"]

[[tool.mypy.overrides]]
module = ["docatlas_dsh_sidecar._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.5",
    "types-jsonschema==4.26.0.20260518",
]
