name: Grounded Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: grounded-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.9.21
          python-version: 3.12.12
          enable-cache: true
      - name: Install actual Linux isolation and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp2
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check independent launch and verification scripts
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/check.sh scripts/prepare-test-source.sh scripts/run-docatlas-web.sh scripts/bootstrap-node.sh scripts/pnpmw scripts/tool-bin/pnpm
      - run: bash scripts/pnpmw install --frozen-lockfile
      - run: uv sync --locked --all-packages --all-groups
      - name: Audit locked Web dependencies
        run: |
          bash scripts/pnpmw audit
          uv export --locked --package docatlas-dsh-sidecar --no-dev --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/docatlas-sidecar-requirements.txt"
          uvx --python 3.12.12 pip-audit==2.10.1 --progress-spinner off --disable-pip --require-hashes --strict -r "$RUNNER_TEMP/docatlas-sidecar-requirements.txt"
      - run: bash scripts/prepare-test-source.sh
      - run: bash scripts/check.sh
      - run: bash scripts/pnpmw exec playwright install --with-deps chromium
      - run: bash scripts/pnpmw run test:live
      - name: Retain owned-code coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grounded-web-coverage
          path: |
            web/.cache/coverage/js/
            web/.cache/coverage/python/coverage.json
            web/.cache/coverage/python/html/
          retention-days: 7
          if-no-files-found: warn
